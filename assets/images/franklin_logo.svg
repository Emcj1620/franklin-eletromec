<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 48" width="360" height="48" fill="none">
  <defs>
    <!-- Steel / Platinum Gradient -->
    <linearGradient id="fe-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F0F2F5"/>
      <stop offset="70%" stop-color="#CBD0D8"/>
      <stop offset="100%" stop-color="#9EA4AD"/>
    </linearGradient>

    <!-- Industrial Gold Gradient -->
    <linearGradient id="fe-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#F5A900"/>
      <stop offset="85%" stop-color="#E08B00"/>
      <stop offset="100%" stop-color="#B86E00"/>
    </linearGradient>

    <!-- Emblem Glow Filter -->
    <filter id="fe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ==================== EMBLEM (Precision Technical Icon) ==================== -->
  <g transform="translate(4, 4)" filter="url(#fe-glow)">
    <!-- Outer Octagonal Industrial Shield / Gear Rim -->
    <path d="M 20 1 L 25 4.5 L 31 3.5 L 34 8.5 L 39 10 L 39.5 16 L 43 19.5 L 40.5 25 L 42 30.5 L 37.5 34.5 L 36.5 40 L 30.5 41 L 26.5 44.5 L 20 42.5 L 14 44.5 L 9.5 41 L 4 40 L 2.5 34.5 L -1.5 30.5 L 0 25 L -2.5 19.5 L 1 16 L 1.5 10 L 6.5 8.5 L 9.5 3.5 L 15 4.5 Z" 
          fill="url(#fe-steel)" stroke="#32363C" stroke-width="0.75" />
    
    <!-- Outer Accent Gold Ring with Industrial Cutouts -->
    <circle cx="20" cy="20" r="16.5" stroke="url(#fe-gold)" stroke-width="2" stroke-dasharray="24 10" fill="none" stroke-linecap="round"/>
    
    <!-- High-Tech Inner Core -->
    <circle cx="20" cy="20" r="12" fill="#0A0C0E" stroke="url(#fe-steel)" stroke-width="1"/>
    
    <!-- Monogram F (Platinum Steel) -->
    <path d="M 12 11 L 22 11 L 21.3 14.5 L 16 14.5 L 15.5 17.8 L 20.5 17.8 L 19.8 21.2 L 15 21.2 L 13.5 29 L 9.5 29 Z" fill="url(#fe-steel)"/>
    
    <!-- Monogram E + Dynamic Energy Ray (Industrial Gold) -->
    <path d="M 21.5 11 L 29.5 11 L 28.7 14.5 L 24 14.5 L 23.3 17.8 L 28 17.2 L 22.5 25 L 23.8 21.2 L 20.8 21.2 Z" fill="url(#fe-gold)"/>
    <path d="M 22.5 25 L 29.5 25 L 28.5 29 L 20 29 L 21.5 25 Z" fill="url(#fe-gold)"/>
    
    <!-- Center Precision Tech Dot -->
    <circle cx="20" cy="20" r="1.5" fill="#FFE082" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <!-- "FRANKLIN" in High-Tech Platinum Steel -->
  <text x="56" y="24" 
        font-family="'Space Grotesk', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="2.5" 
        fill="url(#fe-steel)">FRANKLIN</text>

  <!-- "ELETROMEC" in Signature Industrial Gold -->
  <text x="186" y="24" 
        font-family="'Space Grotesk', 'Inter', 'Segoe UI', Arial, sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="2.5" 
        fill="url(#fe-gold)">ELETROMEC</text>

  <!-- Technical Baseline Subtitle with Accent Marks -->
  <line x1="56" y1="33" x2="88" y2="33" stroke="url(#fe-gold)" stroke-width="1.2" stroke-linecap="round"/>
  
  <text x="94" y="36.5" 
        font-family="'JetBrains Mono', 'Roboto Mono', 'SF Pro Mono', monospace" 
        font-size="6.8" 
        font-weight="700" 
        letter-spacing="2.2" 
        fill="#9DA2A9">INDUSTRIAL AUTOMATION</text>
        
  <line x1="288" y1="33" x2="335" y2="33" stroke="url(#fe-gold)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
