  <circle cx="30" cy="30" r="22" stroke="#8a8d91" stroke-width="1.2" fill="none"/>
  <line x1="30" y1="4" x2="30" y2="56" stroke="#8a8d91" stroke-width="1.2"/>
  <line x1="4" y1="30" x2="56" y2="30" stroke="#8a8d91" stroke-width="1.2"/>
