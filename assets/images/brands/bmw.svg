<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
  <!-- BMW Official Roundel -->
  <g transform="translate(6, 5)">
    <circle cx="20" cy="20" r="19" fill="#000000" stroke="#CCCCCC" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#FFFFFF"/>
    <!-- Bavarian Blue Quadrants -->
    <path d="M20 6 A14 14 0 0 1 34 20 L20 20 Z" fill="#0066B1"/>
    <path d="M20 20 L6 20 A14 14 0 0 1 20 6 Z" fill="#FFFFFF"/>
    <path d="M20 20 L20 34 A14 14 0 0 1 6 20 Z" fill="#0066B1"/>
    <path d="M34 20 A14 14 0 0 1 20 34 L20 20 Z" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="14" fill="none" stroke="#CCCCCC" stroke-width="1"/>
    <!-- Letters -->
    <text x="11.5" y="10" font-family="'Helvetica Neue',Arial,sans-serif" font-size="5.5" font-weight="900" fill="#FFFFFF">B</text>
    <text x="17.5" y="8" font-family="'Helvetica Neue',Arial,sans-serif" font-size="5.5" font-weight="900" fill="#FFFFFF">M</text>
    <text x="24.5" y="10" font-family="'Helvetica Neue',Arial,sans-serif" font-size="5.5" font-weight="900" fill="#FFFFFF">W</text>
  </g>
  <!-- BMW Wordmark -->
  <text x="56" y="33" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">BMW</text>
</svg>
